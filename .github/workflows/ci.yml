name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_USE_MOCK_API: 'false'
      VITE_API_BASE_URL: https://api.gamma-tech.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package the tested build
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          mkdir release
          tar -czf release/frontend.tgz -C dist .
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE_COMMIT
          sha256sum release/frontend.tgz > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
