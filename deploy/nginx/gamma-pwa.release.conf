# Reference configuration for the approved one-time frontend layout migration.
# Do not install this file from CI. The production operator must validate it
# with `nginx -t` and use the migration/rollback procedure documented in
# deploy/FRONTEND_MIGRATION.md.
server {
    server_name app.gamma-tech.ir;

    root /home/gamma/releases/sprint10/frontend/current;
    index index.html;

    # Navigations (including SPA fallbacks) must revalidate after every deploy.
    # Deterministic archives have mtime=0. Equal-sized HTML from different
    # releases otherwise shares Nginx's mtime/size ETag and Last-Modified.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;

    location = /release.json {
        default_type application/json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /release.json =404;
    }

    # Asset misses are 404s, never successful HTML responses. The retained pool
    # keeps lazy chunks usable in tabs opened before an atomic release switch.
    location /assets/ {
        etag on;
        if_modified_since exact;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @retained_frontend_asset;
    }
    location @retained_frontend_asset {
        etag on;
        if_modified_since exact;
        root /home/gamma/releases/sprint10/frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The release health check must never receive the SPA fallback document.
    location = /SOURCE_COMMIT {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /SOURCE_COMMIT =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/app.gamma-tech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gamma-tech.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name app.gamma-tech.ir;
    return 301 https://$host$request_uri;
}
