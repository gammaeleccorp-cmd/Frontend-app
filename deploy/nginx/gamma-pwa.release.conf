# Reference configuration for the approved one-time frontend layout migration.
# Do not install this file from CI. The production operator must validate it
# with `nginx -t` and use the migration/rollback procedure documented in
# deploy/FRONTEND_MIGRATION.md.
server {
    server_name app.gamma-tech.ir;

    root /home/gamma/releases/sprint10/frontend/current;
    index index.html;

    # The release health check must never receive the SPA fallback document.
    location = /SOURCE_COMMIT {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /SOURCE_COMMIT =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/app.gamma-tech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gamma-tech.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name app.gamma-tech.ir;
    return 301 https://$host$request_uri;
}
